<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="amplitude-project-key" content="ab6a2b071f76c45f9cc8a477251aaf9d">
  <title>Feedback | Viator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    main { flex: 1; width: min(100% - 40px, 720px); margin: 3rem auto; }
    #card-slot { margin-top: 1rem; min-height: 2px; }
    #card-status:empty { display: none; }
  </style>
  <script defer src="telemetry.js"></script>
</head>
<body>
<header><div class="bar"><a class="brand" href="index.html#home" aria-label="Viator home"><img src="images/viator.svg" width="100" height="25" alt="Viator"><small>a Tripadvisor company</small></a><a href="index.html#destinations">Discover ﹀</a><div class="nav"><a aria-label="Language and currency" href="https://www.viator.com/">◎</a><a aria-label="Wishlist" href="https://www.viator.com/wishlists">♡</a><a aria-label="Help Center" href="https://www.viator.com/help">ⓘ</a><a aria-label="Rewards" href="https://www.viator.com/rewards">♧</a><a class="login" href="https://www.viator.com/login">Log in</a></div></div></header>
  <main>
    <h1>Tour feedback</h1>
    <button type="button" class="btn" id="give-feedback" aria-controls="card-slot">Give feedback</button>
    <section id="card-slot" aria-label="Feedback"></section>
    <p id="card-status" role="status"></p>
  </main>
  <script>
    const feedbackButton = document.getElementById('give-feedback');
    const feedbackSlot = document.getElementById('card-slot');
    const feedbackStatus = document.getElementById('card-status');
    let pending;
    feedbackButton.addEventListener('click', async () => {
      if (feedbackSlot.querySelector('[role="radiogroup"]')) {
        feedbackSlot.scrollIntoView({ block: 'nearest' });
        return;
      }
      const unavailable = 'The survey could not be opened. Please try again.';
      clearTimeout(pending);
      feedbackStatus.textContent = 'Opening survey…';
      try {
        if (!window.engagement?.gs?.show) throw new Error('Survey service unavailable');
        pending = setTimeout(() => { feedbackStatus.textContent = unavailable; }, 10000);
        await window.engagement.gs.show('survey-viator-tour-informat');
      } catch {
        clearTimeout(pending);
        feedbackStatus.textContent = unavailable;
      }
    });
    new MutationObserver(() => {
      if (feedbackSlot.childElementCount) {
        clearTimeout(pending);
        feedbackStatus.textContent = '';
      }
    }).observe(feedbackSlot, { childList: true, subtree: true });
  </script>
<footer><strong>viator</strong><p>Tours · Activities · Travel experiences</p><a href="index.html#home">Home</a> · <a href="feedback.html" aria-current="page">Feedback</a> · <a href="https://www.viator.com/">Visit Viator</a></footer>
</body>
</html>
